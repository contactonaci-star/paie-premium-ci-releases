<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Paie Premium CI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="lock" class="lock hidden"></div>
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" id="brandLogo">P</div>
        <div><div class="brand-name">Paie Premium</div><div class="brand-sub">Côte d'Ivoire</div></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot" id="sideFoot"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Tableau de bord</h1>
          <div class="crumb" id="pageSub"></div>
        </div>
        <div class="topbar-right">
          <div class="period-pill" id="periodPill"></div>
          <button class="btn btn-sm cmd-trigger" id="cmdBtn" title="Recherche rapide (Ctrl+K)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <kbd>Ctrl K</kbd>
          </button>
          <button class="btn btn-sm btn-icon" id="alertsBtn" title="Anomalies du mois" onclick="App.go('dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="badge red hidden" id="alertsBadge">0</span>
          </button>
          <button class="btn btn-accent" id="btnCloture">Clôturer le mois</button>
        </div>
      </header>
      <section id="page" class="page"></section>
    </main>
  </div>
  <div id="printArea" class="print-area"></div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts"></div>
  <div id="cmdPalette" class="cmd-palette hidden">
    <div class="cmd-wrap">
      <div class="cmd-search-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cmdInput" placeholder="Rechercher une page, un salarié, une action…" autocomplete="off" spellcheck="false">
        <kbd>Échap</kbd>
      </div>
      <div id="cmdResults" class="cmd-results"></div>
    </div>
  </div>
  <script src="vendor/chart.umd.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/pages-core.js"></script>
  <script src="js/pages-paie.js"></script>
  <script src="js/pages-rh.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
